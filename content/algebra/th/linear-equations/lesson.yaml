concepts:
  - title: สมการเชิงเส้นคืออะไร?
    body: "สมการเชิงเส้นคือสมการที่เลขชี้กำลังสูงสุดของตัวแปรคือ $1$ รูปแบบทั่วไปคือ $ax + b = c$ โดยที่ $x$ คือตัวแปร และ $a$, $b$, $c$ เป็นค่าคงตัวที่ $a \neq 0$ กราฟของสมการเชิงเส้นตัวแปรเดียวคือจุดจุดหนึ่งบนเส้นจำนวน ส่วนในสองตัวแปรจะเป็นเส้นตรง"
  - title: หลักการความสมดุล (The Balance Principle)
    body: "การแก้สมการอาศัยหลักการความสมดุล: ไม่ว่าคุณจะดำเนินการใดๆ กับข้างหนึ่งของสมการ คุณต้องทำแบบเดียวกันกับอีกข้างหนึ่งเสมอ สิ่งนี้ช่วยรักษาสมการให้เป็นจริง นึกถึงตาชั่งที่สมดุล — ถ้าคุณเพิ่มน้ำหนักข้างหนึ่ง คุณก็ต้องเพิ่มน้ำหนักเท่ากันที่อีกข้างหนึ่งเพื่อให้มันยังคงสมดุล"
  - title: การดำเนินการผกผัน (Inverse Operations)
    body: "เพื่อแยกตัวแปร ให้ใช้การดำเนินการผกผัน:\n\n| การดำเนินการ | การดำเนินการผกผัน |\n|---|---|\n| การบวก ($+$) | การลบ ($-$) |\n| การลบ ($-$) | การบวก ($+$) |\n| การคูณ ($\\times$) | การหาร ($\\div$) |\n| การหาร ($\\div$) | การคูณ ($\\times$) |\n| ยกกำลังสอง ($x^2$) | ถอดรากที่สอง ($\\sqrt{\\phantom{x}}$) |\n\nเป้าหมายคือการยกเลิกทุกสิ่งที่กระทำกับตัวแปร ในลำดับย้อนกลับ (ตรงข้ามกับ PEMDAS)"
  - title: การตรวจสอบคำตอบ
    body: "ควรตรวจสอบคำตอบของคุณเสมอโดยการแทนค่ากลับเข้าไปในสมการเริ่มต้น ถ้าทั้งสองข้างมีค่าเท่ากัน แสดงว่าคำตอบนั้นถูกต้อง ตัวอย่างเช่น ถ้า $x = 4$ เป็นคำตอบของ $x + 3 = 7$ แล้ว $4 + 3 = 7$ จะเป็นการยืนยันความถูกต้อง"
examples:
  - title: สมการขั้นตอนเดียว
    problem: "จงแก้สมการ $x + 3 = 7$"
    solution: "$x = 4$"
    steps:
      - "$x + 3 = 7$"
      - "ลบ $3$ ทั้งสองข้าง: $x + 3 - 3 = 7 - 3$"
      - "$x = 4$"
      - "ตรวจสอบ: $4 + 3 = 7$ ✓"
  - title: สมการสองขั้นตอน
    problem: "จงแก้สมการ $2x - 5 = 11$"
    solution: "$x = 8$"
    steps:
      - "$2x - 5 = 11$"
      - "บวก $5$ ทั้งสองข้าง: $2x - 5 + 5 = 11 + 5$"
      - "$2x = 16$"
      - "หารด้วย $2$ ทั้งสองข้าง: $\\frac{2x}{2} = \\frac{16}{2}$"
      - "$x = 8$"
      - "ตรวจสอบ: $2(8) - 5 = 16 - 5 = 11$ ✓"
  - title: ตัวแปรอยู่ทั้งสองข้าง
    problem: "จงแก้สมการ $3x + 7 = 2x - 5$"
    solution: "$x = -12$"
    steps:
      - "$3x + 7 = 2x - 5$"
      - "ลบ $2x$ ทั้งสองข้าง: $3x - 2x + 7 = 2x - 2x - 5$"
      - "$x + 7 = -5$"
      - "ลบ $7$ ทั้งสองข้าง: $x + 7 - 7 = -5 - 7$"
      - "$x = -12$"
      - "ตรวจสอบ: $3(-12) + 7 = -36 + 7 = -29$ และ $2(-12) - 5 = -24 - 5 = -29$ ✓"
  - title: สมการที่มีเศษส่วน
    problem: "จงแก้สมการ $\\frac{x}{3} + 2 = 5$"
    solution: "$x = 9$"
    steps:
      - "$\\frac{x}{3} + 2 = 5$"
      - "ลบ $2$ ทั้งสองข้าง: $\\frac{x}{3} + 2 - 2 = 5 - 2$"
      - "$\\frac{x}{3} = 3$"
      - "คูณด้วย $3$ ทั้งสองข้าง: $3 \\cdot \\frac{x}{3} = 3 \\cdot 3$"
      - "$x = 9$"
      - "ตรวจสอบ: $\\frac{9}{3} + 2 = 3 + 2 = 5$ ✓"
