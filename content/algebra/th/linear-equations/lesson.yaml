title: สมการเชิงเส้นตัวแปรเดียว
subject: algebra
subjectTitle: พีชคณิต
description: "สมการเชิงเส้นคือสมการที่อยู่ในรูป $ax + b = c$ โดยที่ $a$, $b$, และ $c$ เป็นค่าคงตัว บทเรียนนี้ครอบคลุมเทคนิคในการแก้สมการเชิงเส้นที่มีความซับซ้อนเพิ่มขึ้น ตั้งแต่สมการขั้นตอนเดียวไปจนถึงสมการที่มีตัวแปรทั้งสองข้าง"
order: 1
topics:
  - title: สมการขั้นตอนเดียว
    description: "แก้สมการที่ต้องใช้การดำเนินการเพียงขั้นตอนเดียว เช่น $x + 3 = 7$ หรือ $2x = 10$"
    body: |
      สมการขั้นตอนเดียวต้องใช้ **การดำเนินการผกผัน (inverse operation)** เพียงหนึ่งครั้งในการแยกตัวแปร ตัวอย่างเช่น:

      - $x + 3 = 7$: ลบ $3$ ทั้งสองข้าง → $x = 4$
      - $2x = 10$: หารด้วย $2$ ทั้งสองข้าง → $x = 5$
      - $x - 3 = 7$: บวก $3$ ทั้งสองข้าง → $x = 10$
      - $\frac{x}{2} = 5$: คูณด้วย $2$ ทั้งสองข้าง → $x = 10$

      กุญแจสำคัญคือการระบุว่ามีการดำเนินการใดกระทำกับตัวแปรอยู่ และใช้การดำเนินการผกผันของมัน
  - title: สมการหลายขั้นตอน
    description: "แก้สมการที่ต้องใช้การดำเนินการหลายขั้นตอน เช่น $2x - 5 = 11$"
    body: |
      สมการหลายขั้นตอนต้องใช้การดำเนินการผกผันมากกว่าหนึ่งครั้ง กลยุทธ์คือ **ย้อนกลับลำดับการดำเนินการ** (ย้อนกลับการบวก/ลบก่อน แล้วจึงตามด้วยการคูณ/หาร):

      สำหรับ $2x - 5 = 11$:
      1. บวก $5$ ทั้งสองข้าง: $2x = 16$
      2. หารด้วย $2$ ทั้งสองข้าง: $x = 8$

      ควรตรวจสอบคำตอบเสมอโดยการแทนค่ากลับเข้าไปในสมการเริ่มต้น
  - title: สมการที่มีเศษส่วน
    description: "แก้สมการที่มีเศษส่วนเข้ามาเกี่ยวข้อง เช่น $\\frac{x}{3} + 2 = 5$."
    body: |
      เมื่อแก้สมการที่มีเศษส่วน คุณมีสองวิธี:

      - **กำจัดเศษส่วน**: คูณทั้งสองข้างด้วยตัวส่วน
      - **ทำแบบหลายขั้นตอน**: ย้อนกลับการบวก/ลบก่อน แล้วจึงจัดการกับเศษส่วน (ซึ่งก็คือการหารด้วยตัวส่วน)

      สำหรับ $\frac{x}{3} + 2 = 5$:
      1. ลบ $2$: $\frac{x}{3} = 3$
      2. คูณด้วย $3$: $x = 9$

      สำหรับสมการที่มีเศษส่วนหลายตัว การคูณด้วย **ตัวคูณร่วมน้อย (ค.ร.น.)** จะช่วยกำจัดเศษส่วนทั้งหมดได้ในคราวเดียว
  - title: ตัวแปรอยู่ทั้งสองข้าง
    description: "แก้สมการที่มีตัวแปรอยู่ทั้งสองข้าง เช่น $3x + 7 = 2x - 5$"
    body: |
      เมื่อมีตัวแปรอยู่ทั้งสองข้าง เป้าหมายคือ **รวมพจน์ที่มีตัวแปรไว้ข้างหนึ่ง** และ **พจน์ค่าคงตัวไว้อีกข้างหนึ่ง**:

      สำหรับ $3x + 7 = 2x - 5$:
      1. ลบ $2x$ ทั้งสองข้าง: $x + 7 = -5$
      2. ลบ $7$ ทั้งสองข้าง: $x = -12$

      **เคล็ดลับ**: ควรย้ายพจน์ของตัวแปรที่มีค่าน้อยกว่าเสมอ เพื่อหลีกเลี่ยงสัมประสิทธิ์ติดลบถ้าเป็นไปได้
