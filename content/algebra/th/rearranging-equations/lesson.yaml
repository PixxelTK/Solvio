concepts:
  - title: การแก้สมการติดตัวแปรคืออะไร?
    body: "ปกติเวลาเราแก้สมการ คำตอบมักจะออกมาเป็นตัวเลขตัวเดียว (เช่น $x = 5$) แต่ในบทนี้ คำตอบของเราจะออกมาเป็นกลุ่มตัวแปรแทน เช่น ถ้าเรามีสมการเส้นตรง $y = mx + b$ เราสามารถย้ายข้างหาค่า $x$ ออกมาในรูปของตัวแปรที่เหลือได้ ซึ่งช่วยให้เราเข้าใจความสัมพันธ์ของตัวแปรในระบบได้ดียิ่งขึ้น"
  - title: ใช้หลักการย้ายข้างเหมือนเดิมเป๊ะ
    body: "การแก้สมการแบบนี้ไม่ได้มีสูตรพิศดารอะไรเลยครับ หลักการย้ายข้างเพื่อรักษาความสมดุลของสมการซ้าย-ขวาที่เรียนมาตอนประถม-ม.ต้น ยังใช้ได้เหมือนเดิมทุกประการ ข้อแตกต่างเดียวคือคำตอบสุดท้ายจะยังมีตัวแปรอื่นๆ ติดอยู่ วิธีคิดง่ายๆ คือ ให้โฟกัสแค่ตัวแปรที่เราต้องการหา ส่วนตัวแปรที่เหลือให้มองว่ามันเป็นแค่ตัวเลขกลมๆ ตัวหนึ่ง"
  - title: เทคนิคการย้ายข้าง (ตัวไหนอยู่ไกลให้ย้ายก่อน)
    body: "เวลาที่เราต้องการแยกตัวแปรเป้าหมายให้อยู่ฝั่งเดียว ให้ใช้หลักการ **\"ทำย้อนกลับ\"** หรือแกะจากนอกเข้าใน:\n\n1. จัดการกับการบวกและการลบก่อน (พจน์ไหนที่ไม่มีตัวแปรที่เราต้องการ ให้ย้ายหนีไปอีกฝั่งให้หมด)\n2. จัดการกับการคูณและการหาร\n3. จัดการกับกลุ่มเลขยกกำลัง วงเล็บ หรือเครื่องหมายสแควรูทเป็นลำดับสุดท้าย\n\nจำง่ายๆ คือ ตัวไหนที่อยู่ไกลหรือบวกลบอยู่รอบนอกสุด ให้รีบย้ายฝั่งไปก่อน แล้วค่อยๆ แก้ไขพจน์ที่ติดอยู่กับตัวแปรเป้าหมาย"
  - title: ทำไมเราถึงต้องติดตัวแปรไว้?
    body: "ประโยชน์ที่ยิ่งใหญ่ของการจัดรูปสมการคือ \"ความสะดวกในการเอาไปใช้ต่อ\" ลองนึกภาพสูตรพื้นที่วงกลม $A = \\pi r^2$ ถ้าโจทย์ให้พื้นที่มาแล้วสั่งให้หาความยาวรัศมี ($r$) สัก 10 ข้อ การที่เราย้ายข้างสูตรล่วงหน้าจนได้ $r = \\sqrt{\\frac{A}{\\pi}}$ จะช่วยให้เราจิ้มเครื่องคิดเลขแทนค่าได้เร็วขึ้นมาก ไม่ต้องคอยมานั่งแก้สมการใหม่ทีละข้อ นี่คือเหตุผลที่นักวิทยาศาสตร์นิยมจัดรูปสมการให้เรียบร้อยก่อนจะแทนตัวเลขลงไปคำนวณจริง"
examples:
  - title: การแก้สมการหาค่าตัวแปร
    problem: "จากสมการ $2x + 3y = 6$ จงจัดรูปหาค่า $y$"
    solution: "$y = \\frac{6 - 2x}{3}$"
    steps:
      - "$2x + 3y = 6$"
      - "ย้าย $2x$ ไปลบอีกฝั่ง: $3y = 6 - 2x$"
      - "ย้าย $3$ ไปหารทั้งฝั่ง: $\\frac{3y}{3} = \\frac{6 - 2x}{3}$"
      - "$y = \\frac{6 - 2x}{3}$"
      - "หรือจะกระจายเศษส่วนเขียนอีกแบบก็ได้เป็น: $y = 2 - \\frac{2x}{3}$"
  - title: การจัดรูปสูตรคำนวณ
    problem: "จากสูตรดอกเบี้ยอย่างง่าย $I = Prt$ จงย้ายข้างเพื่อหาค่า $r$ (อัตราดอกเบี้ย)"
    solution: "$r = \\frac{I}{Pt}$"
    steps:
      - "$I = Prt$"
      - "ย้าย $P$ ที่คูณอยู่ไปหารอีกฝั่ง: $\\frac{I}{P} = rt$"
      - "ย้าย $t$ ที่คูณอยู่ไปหารอีกฝั่ง: $\\frac{I}{Pt} = r$"
      - "$r = \\frac{I}{Pt}$"
      - "สรุปได้ว่า อัตราดอกเบี้ยหาได้จาก ดอกเบี้ยทั้งหมดหารด้วย (เงินต้นคูณกับเวลา)"
  - title: การจัดรูปสูตรเรขาคณิต
    problem: "สูตรพื้นที่ผิวของทรงกระบอกคือ $A = 2\\pi r^2 + 2\\pi rh$ จงจัดรูปเพื่อหาค่าความสูง ($h$)"
    solution: "$h = \\frac{A - 2\\pi r^2}{2\\pi r}$"
    steps:
      - "$A = 2\\pi r^2 + 2\\pi rh$"
      - "ย้ายก้อน $2\\pi r^2$ ไปลบออกอีกฝั่ง: $A - 2\\pi r^2 = 2\\pi rh$"
      - "ย้ายกลุ่มที่คูณอยู่กับ $h$ คือ $2\\pi r$ ไปหารทั้งฝั่ง: $\\frac{A - 2\\pi r^2}{2\\pi r} = h$"
      - "$h = \\frac{A - 2\\pi r^2}{2\\pi r}$"
