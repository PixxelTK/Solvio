title: การจัดรูปสมการ
subject: algebra
subjectTitle: พีชคณิต
description: "การจัดรูปสมการ (หรือการแก้สมการติดตัวแปร) คือการย้ายข้างเพื่อแยกตัวแปรที่เราสนใจให้ออกมาอยู่ตัวเดียวเดี่ยวๆ ในรูปของตัวแปรอื่น ทักษะนี้จำเป็นมากเวลาเราต้องดัดแปลงสูตรในวิชาวิทยาศาสตร์ ฟิสิกส์ หรือวิศวกรรมศาสตร์"
order: 2
topics:
  - title: การแก้สมการหาค่าตัวแปร
    description: "แยกตัวแปรเป้าหมายให้อยู่ฝั่งใดฝั่งหนึ่งของสมการที่มีหลายตัวแปร"
    body: |
      เมื่อต้องการแก้สมการเพื่อหาค่าตัวแปรตัวใดตัวหนึ่งในสมการที่มีหลายตัวแปร ให้เรามองตัวแปรตัวอื่นๆ ทั้งหมดเป็นเหมือน "ตัวเลขธรรมดา" (ค่าคงที่) แล้วใช้หลักการย้ายข้างเพื่อแก้สมการตามปกติได้เลย:

      ตัวอย่าง: จากสมการ $2x + 3y = 6$ ถ้าต้องการจัดรูปหาค่า $y$:
      1. ย้าย $2x$ ไปลบ: $3y = 6 - 2x$
      2. ย้าย $3$ ที่คูณอยู่ไปหาร: $y = \\frac{6 - 2x}{3}$

      คำตอบที่ได้จะติดอยู่ในรูปของตัวแปรที่เหลือ ซึ่งเป็นเรื่องปกติและถูกต้องตามหลักคณิตศาสตร์
  - title: การจัดรูปสูตรคำนวณ
    description: "เปลี่ยนรูปสูตรทางวิทยาศาสตร์และเรขาคณิต เพื่อสลับไปหาปริมาณตัวอื่นที่เราต้องการ"
    body: |
      สูตรคำนวณต่างๆ ก็คือสมการที่ใช้ตัวอักษรแทนค่าในชีวิตจริง การจัดรูปสูตรจะช่วยให้เราสลับไปหาค่าของตัวแปรตัวไหนก็ได้ตามที่โจทย์กำหนด:

      | สูตรเริ่มต้น | ตัวแปรที่โจทย์ให้หา | สูตรใหม่หลังย้ายข้างแล้ว |
      |---|---|---|
      | $I = Prt$ (สูตรดอกเบี้ย) | $r$ (อัตราดอกเบี้ย) | $r = \\frac{I}{Pt}$ |
      | $A = \\pi r^2$ (พื้นที่วงกลม) | $r$ (รัศมี) | $r = \\sqrt{\\frac{A}{\\pi}}$ |
      | $F = \\frac{9}{5}C + 32$ (สูตรอุณหภูมิ) | $C$ (องศาเซลเซียส) | $C = \\frac{5}{9}(F - 32)$ |

      ผลลัพธ์ที่ได้จะกลายเป็น **สูตรสำเร็จใหม่** ที่เราสามารถเอาไปแทนค่าเพื่อคิดเลขต่อได้ทันที
  - title: สมการแบบติดตัวแปร
    description: "การแก้สมการที่ใช้ตัวอักษรแทนตำแหน่งของตัวเลข"
    body: |
      สมการประเภทนี้จะมีตัวอักษรมาแทนที่ตัวเลขแทบทั้งหมด แต่วิธีคิดย้ายข้างนั้นเหมือนเดิมทุกประการ แค่ให้คิดว่าตัวอักษรพวกนั้นเป็นตัวเลขตัวหนึ่งในใจ:

      ตัวอย่าง: จากสมการ $ax + b = c$ ถ้าต้องการหาค่า $x$:
      1. ย้าย $b$ ไปลบ: $ax = c - b$
      2. ย้าย $a$ ไปหาร: $x = \\frac{c - b}{a}$

      วิธีนี้จะทำให้เราได้ **คำตอบในกรณีทั่วไป** ที่ไม่ว่า $a$, $b$ และ $c$ จะเปลี่ยนเป็นเลขอะไร เราก็ใช้สูตรนี้หาคำตอบได้เสมอ (โดยที่ $a \\neq 0$)
practiceModule: multivariable-equation-system
