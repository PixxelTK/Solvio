title: ระบบสมการ
subject: algebra
subjectTitle: พีชคณิต
description: "ระบบสมการ คือกลุ่มของสมการตั้งแต่สองสมการขึ้นไปที่มีตัวแปรชุดเดียวกัน การแก้ระบบสมการหมายถึงการหาค่าของตัวแปรที่ทำให้ทุกสมการในระบบเป็นจริงพร้อมๆ กัน บทเรียนนี้จะครอบคลุมวิธีหลักๆ 3 วิธี ได้แก่ การวาดกราฟ, วิธีแทนค่า และวิธีกำจัดตัวแปร"
order: 3
topics:
  - title: ทำความรู้จักกับระบบสมการ
    description: "ทำความเข้าใจว่าระบบสมการคืออะไร และคำตอบของระบบสมการหมายถึงอะไร"
    body: |
      **ระบบสมการ** คือสมการตั้งแต่ 2 สมการขึ้นไปที่มีตัวแปรชุดเดียวกัน โดยคำตอบของระบบสมการก็คือ ค่าของตัวแปรที่เมื่อนำไปแทนค่าแล้วจะต้องทำให้ *ทุกสมการ* เป็นจริงพร้อมกัน

      สำหรับระบบสมการเชิงเส้น 2 ตัวแปร ($x$ และ $y$) คำตอบของระบบสมการจะตรงกับ **จุดตัดของเส้นกราฟ** ทั้งสองเส้นเมื่อนำไปวาดบนระนาบพิกัดฉาก

      ซึ่งผลลัพธ์ที่เป็นไปได้จะมีอยู่ 3 รูปแบบคือ:
      - **มีคำตอบเดียว**: เส้นกราฟตัดกันที่จุดๆ เดียวพอดี
      - **ไม่มีคำตอบ**: เส้นกราฟขนานกัน ทำให้ไม่มีวันตัดกันเลย
      - **มีคำตอบมากมายนับไม่ถ้วน**: เส้นกราฟทั้งสองเส้นทับกันสนิท (เป็นเส้นตรงเดียวกัน)

      วิธีแก้ระบบสมการที่นิยมใช้ทั่วไปมีอยู่ 3 วิธีหลักๆ คือ **การวาดกราฟ**, **วิธีแทนค่า** และ **วิธีกำจัดตัวแปร**
  - title: การแก้ระบบสมการด้วยกราฟ
    description: "หาคำตอบของระบบสมการโดยการวาดกราฟแล้วหาจุดตัด"
    body: |
      วิธีนี้ทำได้โดยการนำสมการทั้งสองมาวาดลงบนระนาบพิกัดฉากเดียวกัน แล้วหาพิกัดของจุดที่เส้นกราฟตัดกัน

      ตัวอย่างเช่น การแก้ระบบสมการ $y = x + 1$ และ $y = -x + 5$:
      1. วาดกราฟเส้นตรง $y = x + 1$ (ความชันเป็น $1$, ตัดแกน $y$ ที่จุด $1$)
      2. วาดกราฟเส้นตรง $y = -x + 5$ (ความชันเป็น $-1$, ตัดแกน $y$ ที่จุด $5$)
      3. เส้นตรงทั้งสองเส้นจะตัดกันที่จุด $(2, 3)$ ดังนั้นคำตอบของระบบสมการคือ $x = 2$ และ $y = 3$

      **ข้อจำกัด**: แม้การวาดกราฟจะช่วยให้เห็นภาพรวมที่ชัดเจน แต่หากคำตอบของสมการเป็นเศษส่วน ทศนิยม หรือเป็นตัวเลขที่มีค่ามากๆ วิธีนี้อาจจะให้ผลลัพธ์คลาดเคลื่อนและไม่แม่นยำ
  - title: การแก้ระบบสมการด้วยวิธีแทนค่า
    description: "หาคำตอบโดยการจัดรูปตัวแปรหนึ่งให้อยู่ในรูปของอีกตัวแปร แล้วนำไปแทนค่าในอีกสมการ"
    body: |
      **วิธีแทนค่า (Substitution Method)** คือการจัดรูปสมการใดสมการหนึ่งให้เหลือตัวแปรเดียวเดี่ยวๆ แล้วนำพจน์นั้นไปแทนที่ในอีกสมการหนึ่ง เพื่อลดรูปสมการให้เหลือตัวแปรเดียว

      **ขั้นตอนการทำ:**
      1. เลือกสมการใดสมการหนึ่ง แล้วจัดรูปให้ตัวแปรหนึ่งอยู่ในรูปของอีกตัวแปร
      2. นำพจน์ตัวแปรที่จัดรูปแล้วไปแทนค่าในอีกสมการที่เหลือ
      3. แก้สมการหาค่าตัวแปรแรกออกมา
      4. นำค่าที่ได้ไปแทนค่ากลับในสมการเริ่มต้นเพื่อหาค่าตัวแปรที่เหลือ

      **ตัวอย่างโจทย์:** จงแก้ระบบสมการ $y = 2x$ และ $x + y = 9$:
      1. จากสมการที่ 1 ตัวแปร $y$ ถูกจัดรูปไว้เรียบร้อยแล้ว คือ $y = 2x$
      2. นำไปแทนค่าในสมการที่ 2 จะได้: $x + 2x = 9$
      3. รวมพจน์: $3x = 9$ จะได้ $x = 3$
      4. นำ $x = 3$ ไปแทนค่ากลับเพื่อหา $y$: $y = 2(3) = 6$

      คำตอบของระบบสมการคือ $(3, 6)$

      วิธีแทนค่านี้จะเหมาะสมที่สุดเมื่อมีสมการใดสมการหนึ่งที่แยกตัวแปรฝั่งใดฝั่งหนึ่งไว้ให้แล้ว หรือหน้าตัวแปรไม่มีเลขสัมประสิทธิ์ ทำให้จัดรูปย้ายข้างได้ง่าย
  - title: การแก้ระบบสมการด้วยวิธีกำจัดตัวแปร
    description: "หาคำตอบโดยการนำสมการมาบวกหรือลบกัน เพื่อตัดตัวแปรตัวใดตัวหนึ่งออกไป"
    body: |
      **วิธีกำจัดตัวแปร (Elimination Method)** คือการนำสมการสองสมการมาบวกหรือลบกัน โดยปรับสัมประสิทธิ์หน้าตัวแปรให้เท่ากัน เพื่อให้ตัวแปรตัวใดตัวหนึ่งหักล้างกันจนหมดไป

      **ขั้นตอนการทำ:**
      1. จัดรูปให้ทั้งสองสมการอยู่ในรูปแบบมาตรฐาน $Ax + By = C$
      2. ปรับสัมประสิทธิ์ (ตัวเลขหน้าตัวแปร) ของตัวแปรที่ต้องการจะกำจัดให้มีค่าเท่ากัน โดยการคูณตัวเลขเข้าทั้งสมการ
      3. นำสมการทั้งสองมาบวกหรือลบกัน เพื่อให้ตัวแปรนั้นหักล้างกันจนหมดไป
      4. แก้สมการหาค่าตัวแปรที่เหลืออยู่
      5. นำค่าที่ได้ไปแทนค่ากลับในสมการใดสมการหนึ่งเพื่อหาตัวแปรอีกตัว

      **ตัวอย่างโจทย์:** จงแก้ระบบสมการ $2x + y = 7$ และ $x - y = 2$:
      1. สังเกตว่าตัวเลขหน้าตัวแปร $y$ ของทั้งสองสมการคือ $1$ และ $-1$ (เครื่องหมายตรงข้ามกัน)
      2. นำสมการทั้งสองมาบวกกัน: $(2x + y) + (x - y) = 7 + 2$
      3. ตัวแปร $y$ จะหักล้างกันหมดไป เหลือเพียง: $3x = 9$ ย้ายข้างได้ $x = 3$
      4. นำ $x = 3$ ไปแทนค่ากลับในสมการ $x - y = 2$ จะได้ $3 - y = 2$ ดังนั้น $y = 1$

      คำตอบของระบบสมการคือ $(3, 1)$

      วิธีกำจัดตัวแปรเป็นวิธีที่มีประสิทธิภาพและนิยมใช้มากที่สุด โดยเฉพาะเมื่อจัดรูปสมการให้อยู่ในแนวเดียวกันเรียบร้อยแล้ว
  - title: กรณีพิเศษของระบบสมการ
    description: "การสังเกตระบบสมการที่ไม่มีคำตอบ หรือมีคำตอบมากมายนับไม่ถ้วน"
    body: |
      ระบบสมการไม่จำเป็นต้องมีคำตอบเดียวเสมอไป ในทางคณิตศาสตร์มีกรณีพิเศษอยู่ 2 รูปแบบ คือ:

      **1. ระบบสมการที่ไม่มีคำตอบ (Inconsistent System):**
      ในทางกราฟ เส้นตรงสองเส้นจะขนานกัน และเมื่อคำนวณด้วยวิธีพีชคณิต ตัวแปรจะตัดกันหายไปทั้งหมดและเหลือข้อความที่เป็นเท็จ เช่น $0 = 5$

      **ตัวอย่าง:** $y = 2x + 3$ และ $y = 2x - 1$
      เมื่อใช้วิธีแทนค่าจะได้: $2x + 3 = 2x - 1$ เมื่อย้ายข้างจะเหลือ $3 = -1$ (ซึ่งเป็นเท็จ) แสดงว่าระบบสมการนี้ไม่มีคำตอบ

      **2. ระบบสมการที่มีคำตอบมากมายนับไม่ถ้วน (Dependent System):**
      ในทางกราฟ เส้นตรงสองเส้นคือเส้นเดียวกันเป๊ะ และเมื่อคำนวณด้วยวิธีพีชคณิต ตัวแปรจะหายไปหมดและเหลือข้อความที่เป็นจริงเสมอ เช่น $0 = 0$

      **ตัวอย่าง:** $y = 3x + 2$ และ $2y = 6x + 4$
      เมื่อแทนสมการแรกในสมการสองจะได้: $2(3x + 2) = 6x + 4$ จะได้ $6x + 4 = 6x + 4$ เมื่อย้ายข้างจะเหลือ $0 = 0$ (ซึ่งเป็นจริงเสมอ) แสดงว่าระบบสมการนี้มีคำตอบมากมายนับไม่ถ้วน
  - title: การเลือกวิธีที่เหมาะสม
    description: "แนวทางการเลือกวิธีแก้สมการตามโครงสร้างของโจทย์"
    body: |
      การเลือกวิธีคำนวณที่เหมาะสมจะขึ้นอยู่กับโครงสร้างและหน้าตาของโจทย์:

      - **การวาดกราฟ**: เหมาะสำหรับใช้ประมาณค่าคำตอบ หรือใช้เมื่อต้องการเห็นภาพรวมความสัมพันธ์ของสมการ
      - **วิธีแทนค่า**: เหมาะสำหรับโจทย์ที่มีการแยกตัวแปรใดตัวแปรหนึ่งไว้แล้ว (เช่น $y = 2x + 3$) หรือสัมประสิทธิ์หน้าตัวแปรเป็น $1$ ซึ่งทำให้จัดรูปง่าย
      - **วิธีกำจัดตัวแปร**: เหมาะสำหรับโจทย์ส่วนใหญ่ โดยเฉพาะเมื่อทั้งสองสมการถูกจัดรูปอยู่ในโครงสร้างมาตรฐาน $Ax + By = C$ เรียบร้อยแล้ว ซึ่งเป็นวิธีที่คำนวณได้รวดเร็วและเป็นระบบที่สุด
