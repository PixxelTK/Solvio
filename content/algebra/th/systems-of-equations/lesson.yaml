concepts:
  - title: ระบบสมการคืออะไร?
    body: "ระบบสมการ คือชุดของสมการที่มีตัวแปรเกี่ยวข้องกันตั้งแต่ 2 สมการขึ้นไป โดยคำตอบของระบบสมการจะต้องเป็นค่าตัวแปรชุดเดียวกันที่ทำให้ทุกสมการในระบบเป็นจริงทั้งหมด"
  - title: ระบบสมการที่มีคำตอบ vs ไม่มีคำตอบ
    body: "ระบบสมการที่มีคำตอบ (ไม่ว่าจะมีคำตอบเดียวหรือมีหลายคำตอบ) เรียกว่า Consistent System ส่วนระบบสมการที่ไม่มีคำตอบเนื่องจากเส้นกราฟขนานกันและไม่มีจุดตัด จะเรียกว่า Inconsistent System"
  - title: สมการที่เป็นอิสระต่อกัน vs สมการพึ่งพิงกัน
    body: "หากเส้นกราฟตัดกันและได้คำตอบเดียวชัดเจน จะเรียกว่าเป็นระบบสมการที่เป็นอิสระต่อกัน (Independent) แต่ถ้าทั้งสองสมการคือเส้นตรงเส้นเดียวกันที่ทับกันสนิท จะเรียกว่าสมการพึ่งพิงกัน (Dependent) ซึ่งจะส่งผลให้มีคำตอบมากมายนับไม่ถ้วน"
  - title: หลักการกำจัดตัวแปร
    body: "การแก้สมการใช้สมบัติการบวกและการลบเพื่อหักล้างตัวแปร การปรับตัวเลขสัมประสิทธิ์หน้าตัวแปรให้เท่ากันล่วงหน้า จะช่วยให้เมื่อนำสมการมาดำเนินการกันแล้ว ตัวแปรเป้าหมายจะหมดไป ทำให้เหลือสมการตัวแปรเดียวที่แก้หาคำตอบได้ง่ายขึ้น"
examples:
  - title: ตัวอย่างการแก้ด้วยวิธีแทนค่า
    problem: "จงแก้ระบบสมการ: $y = 3x$ และ $x + 2y = 21$"
    solution: "$(3, 9)$"
    steps:
      - "$y = 3x$ ------ (สมการที่ 1)"
      - "$x + 2y = 21$ ------ (สมการที่ 2)"
      - "แทนค่า $y = 3x$ ลงในสมการที่ 2 จะได้: $x + 2(3x) = 21$"
      - "คูณเลขในวงเล็บ: $x + 6x = 21$"
      - "รวมพจน์: $7x = 21$"
      - "แก้สมการหาค่า $x$: $x = 3$"
      - "นำค่า $x = 3$ ไปแทนกลับในสมการที่ 1: $y = 3(3) = 9$"
      - "ดังนั้น คำตอบของระบบสมการคือ $(3, 9)$"
  - title: ตัวอย่างการแก้ด้วยวิธีกำจัดตัวแปร
    problem: "จงแก้ระบบสมการ: $3x + 2y = 12$ และ $2x - y = 1$"
    solution: "$(2, 3)$"
    steps:
      - "$3x + 2y = 12$ ------ (สมการที่ 1)"
      - "$2x - y = 1$ ------ (สมการที่ 2)"
      - "คูณสมการที่ 2 ด้วย $2$ ตลอดทั้งสมการเพื่อปรับสัมประสิทธิ์หน้า $y$: $4x - 2y = 2$ ------ (สมการที่ 3)"
      - "นำสมการที่ 1 มาบวกกับสมการที่ 3 เพื่อกำจัดตัวแปร $y$: $(3x + 2y) + (4x - 2y) = 12 + 2$"
      - "ตัวแปร $y$ หักล้างกันหมดไป เหลือเพียง: $7x = 14$"
      - "แก้สมการหาค่า $x$: $x = 2$"
      - "นำค่า $x = 2$ ไปแทนกลับในสมการที่ 2: $2(2) - y = 1$"
      - "คำนวณค่า: $4 - y = 1$ จะได้ $y = 3$"
      - "ดังนั้น คำตอบของระบบสมการคือ $(2, 3)$"
  - title: ตัวอย่างกรณีที่ไม่มีคำตอบ
    problem: "จงแก้ระบบสมการ: $y = 2x + 4$ และ $y = 2x - 3$"
    solution: "ไม่มีคำตอบ"
    steps:
      - "$y = 2x + 4$ ------ (สมการที่ 1)"
      - "$y = 2x - 3$ ------ (สมการที่ 2)"
      - "ใช้วิธีแทนค่าโดยนำสมการที่ 1 มาเท่ากับสมการที่ 2: $2x + 4 = 2x - 3$"
      - "ย้ายข้างพจน์ $2x$ ไปลบกันจนหมด เหลือข้อความ: $4 = -3$ ซึ่งเป็นเท็จ"
      - "สรุปได้ว่าระบบสมการนี้ไม่มีคำตอบ เนื่องจากกราฟของทั้งสองสมการเป็นเส้นตรงที่ขนานกัน"
  - title: ตัวอย่างกรณีที่มีคำตอบมากมายนับไม่ถ้วน
    problem: "จงแก้ระบบสมการ: $x + y = 5$ และ $2x + 2y = 10$"
    solution: "มีคำตอบมากมายนับไม่ถ้วน"
    steps:
      - "$x + y = 5$ ------ (สมการที่ 1)"
      - "$2x + 2y = 10$ ------ (สมการที่ 2)"
      - "คูณสมการที่ 1 ด้วยเลข $2$ ตลอดทั้งสมการ จะได้: $2x + 2y = 10$"
      - "สมการที่ได้มีค่าเท่ากับสมการที่ 2 ทุกพจน์"
      - "แสดงว่าทั้งสองสมการคือเส้นตรงเส้นเดียวกัน (จัดรูปใหม่ได้ $y = -x + 5$)"
      - "ดังนั้น ระบบสมการนี้จึงมีคำตอบมากมายนับไม่ถ้วน โดยทุกจุดบนเส้นตรงถือเป็นคำตอบของระบบสมการ"
