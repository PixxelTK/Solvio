title: Rearranging Equations
subject: algebra
subjectTitle: Algebra
description: "Rearranging equations (also called solving literal equations) involves isolating a specific variable in terms of other variables. This skill is essential for working with formulas in science, engineering, and mathematics."
order: 2
topics:
  - title: Solving for a Variable
    description: "Isolate a specific variable in an equation with multiple variables."
    body: |
      When solving for a specific variable in a multi-variable equation, treat all other variables as constants. The same inverse operation rules apply:

      For $2x + 3y = 6$, solve for $y$:
      1. Subtract $2x$: $3y = 6 - 2x$
      2. Divide by $3$: $y = \\frac{6 - 2x}{3}$

      The answer is expressed **in terms of** the remaining variables — this is perfectly valid in algebra.
  - title: Rearranging Formulas
    description: "Rewrite scientific and geometric formulas to solve for different quantities."
    body: |
      Formulas are literal equations that describe real-world relationships. Rearranging a formula lets you solve for any quantity it contains:

      | Formula | Solve for | Result |
      |---|---|---|
      | $I = Prt$ (interest) | $r$ | $r = \\frac{I}{Pt}$ |
      | $A = \\pi r^2$ (area) | $r$ | $r = \\sqrt{\\frac{A}{\\pi}}$ |
      | $F = \\frac{9}{5}C + 32$ (temperature) | $C$ | $C = \\frac{5}{9}(F - 32)$ |

      The result is a **reusable formula** that works for any input values.
  - title: Literal Equations
    description: "Work with equations where coefficients are represented by letters."
    body: |
      A literal equation has coefficients represented by letters rather than specific numbers. The solving process is identical — just treat the letter coefficients as constants:

      For $ax + b = c$, solve for $x$:
      1. Subtract $b$: $ax = c - b$
      2. Divide by $a$: $x = \\frac{c - b}{a}$

      This gives a **general solution** that works for any values of $a$, $b$, and $c$ (with $a \\neq 0$).
