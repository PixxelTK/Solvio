concepts:
  - title: What is a System of Equations?
    body: "A system of equations is two or more equations with the same variables. The solution is the set of values that satisfy every equation in the system."
  - title: Consistent vs Inconsistent
    body: "A system is **consistent** if it has at least one solution (unique or infinite). It is **inconsistent** if it has no solution (parallel lines)."
  - title: Dependent vs Independent
    body: "A system is **independent** if it has exactly one solution. It is **dependent** if the equations represent the same line, producing infinitely many solutions."
  - title: The Elimination Principle
    body: "Adding or subtracting two equations produces a valid equation. By strategically scaling and combining, you can eliminate one variable to solve for the other."
examples:
  - title: Solving by Substitution
    problem: "Solve: $y = 3x$ and $x + 2y = 21$"
    solution: "$(3, 9)$"
    steps:
      - "$y = 3x$ (equation 1)"
      - "$x + 2y = 21$ (equation 2)"
      - "Substitute $y = 3x$ into equation 2: $x + 2(3x) = 21$"
      - "$x + 6x = 21$"
      - "$7x = 21$"
      - "$x = 3$"
      - "Back-substitute: $y = 3(3) = 9$"
      - "Solution: $(3, 9)$"
  - title: Solving by Elimination
    problem: "Solve: $3x + 2y = 12$ and $2x - y = 1$"
    solution: "$(2, 3)$"
    steps:
      - "$3x + 2y = 12$ (equation 1)"
      - "$2x - y = 1$ (equation 2)"
      - "Multiply equation 2 by $2$: $4x - 2y = 2$"
      - "Add to equation 1: $(3x + 2y) + (4x - 2y) = 12 + 2$"
      - "$7x = 14$"
      - "$x = 2$"
      - "Back-substitute: $2(2) - y = 1$"
      - "$4 - y = 1$"
      - "$y = 3$"
      - "Solution: $(2, 3)$"
  - title: No Solution
    problem: "Solve: $y = 2x + 4$ and $y = 2x - 3$"
    solution: "No solution (inconsistent)"
    steps:
      - "$y = 2x + 4$ (equation 1)"
      - "$y = 2x - 3$ (equation 2)"
      - "Substitute: $2x + 4 = 2x - 3$"
      - "$4 = -3$ (false)"
      - "The system has no solution. The lines are parallel."
  - title: Infinite Solutions
    problem: "Solve: $x + y = 5$ and $2x + 2y = 10$"
    solution: "Infinite solutions (dependent)"
    steps:
      - "$x + y = 5$ (equation 1)"
      - "$2x + 2y = 10$ (equation 2)"
      - "Multiply equation 1 by $2$: $2x + 2y = 10$"
      - "This is identical to equation 2."
      - "The equations represent the same line: $y = -x + 5$"
      - "Every point on the line is a solution."
