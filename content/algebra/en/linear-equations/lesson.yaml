title: Linear Equations
subject: algebra
subjectTitle: Algebra
description: "Linear equations are equations of the form $ax + b = c$ where $a$, $b$, and $c$ are constants. This lesson covers techniques for solving linear equations of increasing complexity, from one-step equations to equations with variables on both sides."
order: 1
topics:
  - title: One-Step Equations
    description: "Solve equations requiring a single operation like $x + 3 = 7$ or $2x = 10$."
    body: |
      A one-step equation requires exactly **one inverse operation** to isolate the variable. For example:

      - $x + 3 = 7$: subtract $3$ from both sides → $x = 4$
      - $2x = 10$: divide both sides by $2$ → $x = 5$
      - $x - 3 = 7$: add $3$ to both sides → $x = 10$
      - $\\frac{x}{2} = 5$: multiply both sides by $2$ → $x = 10$

      The key is identifying which operation is being applied to the variable and using its inverse.
  - title: Multi-Step Equations
    description: "Solve equations requiring multiple operations like $2x - 5 = 11$."
    body: |
      Multi-step equations require more than one inverse operation. The strategy is to **reverse the order of operations** (undo addition/subtraction first, then multiplication/division):

      For $2x - 5 = 11$:
      1. Add $5$ to both sides: $2x = 16$
      2. Divide both sides by $2$: $x = 8$

      Always check by substituting back into the original equation.
  - title: Equations with Fractions
    description: "Solve equations involving fractions like $\\frac{x}{3} + 2 = 5$."
    body: |
      When solving equations with fractions, you have two approaches:

      - **Clear the fraction**: multiply both sides by the denominator
      - **Treat it as a multi-step**: undo addition/subtraction first, then the fraction (which is division by the denominator)

      For $\\frac{x}{3} + 2 = 5$:
      1. Subtract $2$: $\\frac{x}{3} = 3$
      2. Multiply by $3$: $x = 9$

      For equations with multiple fractions, multiplying by the **least common denominator (LCD)** clears all fractions at once.
  - title: Variables on Both Sides
    description: "Solve equations with variables on both sides like $3x + 7 = 2x - 5$."
    body: |
      When the variable appears on both sides, the goal is to **collect variable terms on one side** and **constant terms on the other**:

      For $3x + 7 = 2x - 5$:
      1. Subtract $2x$ from both sides: $x + 7 = -5$
      2. Subtract $7$ from both sides: $x = -12$

      **Tip**: always move the smaller variable term to avoid negative coefficients when possible.
