title: Gaussian Elimination
subject: linear-algebra
subjectTitle: Linear Algebra
description: "Gaussian elimination is a systematic method for solving systems of linear equations. By representing the system as an augmented matrix and applying row operations, we can reduce it to row echelon form and find the solution."
order: 1
topics:
  - title: Row Operations
    description: "Learn the three elementary row operations: swap, scale, and add."
    body: |
      Three elementary row operations can be applied to any augmented matrix without changing the solution set:

      | Operation | Notation | Description |
      |---|---|---|
      | **Row Swap** | $R_i \\leftrightarrow R_j$ | Interchange two rows |
      | **Row Scaling** | $k \\cdot R_i \\rightarrow R_i$ | Multiply a row by a non-zero constant |
      | **Row Addition** | $R_i + k \\cdot R_j \\rightarrow R_i$ | Add a multiple of one row to another |

      These correspond to legitimate algebraic manipulations: swapping equations, multiplying both sides by a constant, and adding equations together.
  - title: Row Echelon Form
    description: "Understand what it means for a matrix to be in row echelon form and reduced row echelon form (RREF)."
    body: |
      A matrix is in **row echelon form (REF)** when:

      - All zero rows are at the bottom
      - Each pivot (leading entry) is to the right of the one above
      - All entries below each pivot are zero

      **Reduced row echelon form (RREF)** adds two stricter conditions:

      - Every pivot is exactly $1$
      - All entries **above and below** each pivot are zero

      | Property | REF | RREF |
      |---|---|---|
      | Zero rows at bottom | {fa:check} | {fa:check} |
      | Pivots right of above | {fa:check} | {fa:check} |
      | Zeros below pivots | {fa:check} | {fa:check} |
      | Pivots equal $1$ | {fa:times} | {fa:check} |
      | Zeros above pivots | {fa:times} | {fa:check} |

      Most Gaussian elimination implementations stop at REF and use **back-substitution**, but reaching RREF gives the solution directly.
  - title: Solving Linear Systems
    description: "Use Gaussian elimination to solve systems of 2 or 3 equations."
    body: |
      Gaussian elimination solves linear systems by:

      1. Writing the system as an **augmented matrix**
      2. Applying row operations to reach **row echelon form**
      3. Using **back-substitution** (or continuing to RREF) to read the solution

      For a 2x2 system, the matrix is $2 \\times 3$ (2 equations, 2 variables + constants). For a 3x3 system, it is $3 \\times 4$. The process scales to any size — this is why Gaussian elimination is the foundation of computational linear algebra.
