concepts:
  - title: The Augmented Matrix
    body: "A system of linear equations can be represented compactly as an augmented matrix. Each row corresponds to an equation, each column (except the last) corresponds to a variable, and the last column (separated by a vertical bar) contains the constants. For example:\n\n$$\\begin{cases} 2x + 3y = 8 \\\\ x - y = -1 \\end{cases} \\rightarrow \\begin{bmatrix} 2 & 3 & | & 8 \\\\ 1 & -1 & | & -1 \\end{bmatrix}$$"
  - title: Elementary Row Operations
    body: "Three operations can be applied to any augmented matrix without changing the solution set:\n\n1. **Row Swap**: Interchange two rows $(R_i \\leftrightarrow R_j)$\n2. **Row Scaling**: Multiply a row by a non-zero constant $(k \\cdot R_i \\rightarrow R_i)$\n3. **Row Addition**: Add a multiple of one row to another $(R_i + k \\cdot R_j \\rightarrow R_i)$\n\nThese operations correspond to legitimate algebraic manipulations of the original equations."
  - title: Row Echelon Form (REF)
    body: "A matrix is in row echelon form when:\n\n- All zero rows are at the bottom\n- The leading entry (pivot) of each non-zero row is to the right of the leading entry of the row above\n- All entries below a pivot are zero\n\n**Reduced** Row Echelon Form (RREF) adds two more conditions:\n\n- Every pivot is exactly $1$\n- All entries above and below each pivot are zero\n\n| Property | REF | RREF |\n|---|---|---|\n| Zero rows at bottom | {fa:check} | {fa:check} |\n| Pivots right of above | {fa:check} | {fa:check} |\n| Zeros below pivots | {fa:check} | {fa:check} |\n| Pivots equal $1$ | {fa:times} | {fa:check} |\n| Zeros above pivots | {fa:times} | {fa:check} |"
  - title: Gaussian Elimination Algorithm
    body: "The algorithm proceeds column by column, left to right:\n\n1. Find a non-zero entry in the current column (the pivot)\n2. Swap to bring the pivot row to the top of the remaining rows\n3. Scale the pivot row to make the pivot $1$\n4. Eliminate all entries below the pivot using row addition\n5. Move to the next column and repeat\n\nTo reach RREF, after reaching row echelon form, work backwards eliminating entries above each pivot."
examples:
  - title: Solving a 2x2 System
    problem: "Solve using Gaussian elimination: $\\begin{cases} 2x + 3y = 8 \\\\ x - y = -1 \\end{cases}$"
    solution: "$x = 1$, $y = 2$"
    steps:
      - "Write the augmented matrix: $\\begin{bmatrix} 2 & 3 & | & 8 \\\\ 1 & -1 & | & -1 \\end{bmatrix}$"
      - "Swap $R_1 \\leftrightarrow R_2$ to bring a $1$ to the top-left: $\\begin{bmatrix} 1 & -1 & | & -1 \\\\ 2 & 3 & | & 8 \\end{bmatrix}$"
      - "Eliminate below: $R_2 - 2R_1 \\rightarrow R_2$: $\\begin{bmatrix} 1 & -1 & | & -1 \\\\ 0 & 5 & | & 10 \\end{bmatrix}$"
      - "Scale $R_2$: $\\frac{1}{5}R_2 \\rightarrow R_2$: $\\begin{bmatrix} 1 & -1 & | & -1 \\\\ 0 & 1 & | & 2 \\end{bmatrix}$"
      - "Eliminate above: $R_1 + R_2 \\rightarrow R_1$: $\\begin{bmatrix} 1 & 0 & | & 1 \\\\ 0 & 1 & | & 2 \\end{bmatrix}$"
      - "Read the solution: $x = 1$, $y = 2$"
  - title: Solving a 3x3 System
    problem: "Solve: $\\begin{cases} x + y + z = 6 \\\\ 2x - y + z = 3 \\\\ x + 2y - z = 2 \\end{cases}$"
    solution: "$x = 1$, $y = 2$, $z = 3$"
    steps:
      - "Write the augmented matrix: $\\begin{bmatrix} 1 & 1 & 1 & | & 6 \\\\ 2 & -1 & 1 & | & 3 \\\\ 1 & 2 & -1 & | & 2 \\end{bmatrix}$"
      - "Eliminate below the first pivot: $R_2 - 2R_1 \\rightarrow R_2$, $R_3 - R_1 \\rightarrow R_3$: $\\begin{bmatrix} 1 & 1 & 1 & | & 6 \\\\ 0 & -3 & -1 & | & -9 \\\\ 0 & 1 & -2 & | & -4 \\end{bmatrix}$"
      - "Swap $R_2 \\leftrightarrow R_3$: $\\begin{bmatrix} 1 & 1 & 1 & | & 6 \\\\ 0 & 1 & -2 & | & -4 \\\\ 0 & -3 & -1 & | & -9 \\end{bmatrix}$"
      - "Eliminate below: $R_3 + 3R_2 \\rightarrow R_3$: $\\begin{bmatrix} 1 & 1 & 1 & | & 6 \\\\ 0 & 1 & -2 & | & -4 \\\\ 0 & 0 & -7 & | & -21 \\end{bmatrix}$"
      - "Scale $R_3$: $-\\frac{1}{7}R_3 \\rightarrow R_3$: $\\begin{bmatrix} 1 & 1 & 1 & | & 6 \\\\ 0 & 1 & -2 & | & -4 \\\\ 0 & 0 & 1 & | & 3 \\end{bmatrix}$"
      - "Back-substitute or eliminate above: $R_2 + 2R_3 \\rightarrow R_2$, $R_1 - R_3 \\rightarrow R_1$: $\\begin{bmatrix} 1 & 1 & 0 & | & 3 \\\\ 0 & 1 & 0 & | & 2 \\\\ 0 & 0 & 1 & | & 3 \\end{bmatrix}$"
      - "Finally eliminate: $R_1 - R_2 \\rightarrow R_1$: $\\begin{bmatrix} 1 & 0 & 0 & | & 1 \\\\ 0 & 1 & 0 & | & 2 \\\\ 0 & 0 & 1 & | & 3 \\end{bmatrix}$"
      - "Read the solution: $x = 1$, $y = 2$, $z = 3$"
